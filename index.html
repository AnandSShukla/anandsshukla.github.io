<!DOCTYPE html>
<html lang="en">

<head>
     <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Decryptor Tool By Anand Shukla</title>
    <script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
    <link rel="icon" type="image/png" href="akshar.svg">
</head>

<body>
    <div class="headercontainer">
   <h2>Choose your decryption tool !</h2>

    <div class="radioSelection">
    
        <div class="radioBox">
            <div class="radioOption">
                <input type="radio" checked id="rsa" value="rsa" name="tool" onclick="onClickRadioSelection(event.target.value)" style="margin-right: 12px;" />
                <label htmlFor="rsa">RSA Tool</label>
            </div>
    
            <div class="radioOption">
                <input type="radio" id="aes" value="aes" name="tool" onclick="onClickRadioSelection(event.target.value)"  style="margin-right: 12px;"/>
                <label htmlFor="aes">AES Tool</label>
            </div>
        </div>
    </div>

    </div>

    <div class="container">
        <div id="Header" style="display: none;">
            <h2>RSA Decryption Tool</h2>
            <div class="header-actions">
                <a href="https://buymeacoffee.com/aksharbramh" target="_blank" class="donate-btn">
                    Support the DEV
                </a>
            </div>
        </div>

        <div class="form-group">
            <label for="xClientSign">RSA Encrypted Key </label>
            <input type="text" id="xClientSign" placeholder="Paste RSA Encrypted Key here...">
        </div>

        <div class="form-group">
            <label for="rsaPvtKey">RSA Private Key </label>
            <input type="text" id="rsaPvtKey" placeholder="Enter RSA private key here...">
        </div>
        <div class="form-group">
            <label for="IV">Enter you IV here</label>
            <input type="text" id="IV" placeholder="Enter IV here...">
        </div>
        <div class="form-group">
            <label for="encryptedData">Encrypted Data to be decrypted:</label>
            <textarea id="encryptedData" placeholder="Paste the encrypted message string here..."></textarea>
        </div>


        <button class="btn-primary" onclick="handleDecryption()">Decrypt</button>

        <div class="output-header">
            <h3>Decrypted JSON Output:</h3>
            <div>
                <button class="btn-secondary" onclick="copyToClipboard()">Copy</button>
                <span id="copyToast" class="success-toast" style="display: none;">Copied!</span>
            </div>
        </div>

        <pre id="outputResult">Your decrypted output will appear here...</pre>
        <script src="decryptWithHtml.js">

        </script>
        <script src="aesDeceryptionLogic.js">
        </script>

    </div>

    <div class="containertwo" style="display:none">

        <div class="card">
            <div class="form-group">
                <label for="aesKey">AES-256 Key </label>
                <input type="text" id="aesKey" placeholder="Enter AES-256 Key here...">
            </div>

            <div class="form-group">
                <label for="AESIV">Enter you IV here</label>
                <input type="text" id="AESIV" placeholder="Enter IV here...">
            </div>


            <label for="encryptedText">
                Encrypted Text
            </label>

            <textarea id="encryptedText" placeholder="Paste Base64 encrypted text here..."></textarea>


            <div class="buttons">
                <button class="decrypt" onclick="decryptText(false)">
                    Decrypt Text
                </button>
                <button class="json" onclick="decryptText(true)">
                    Prettify Output
                </button>
            </div>


            <div class="output">

                <label for="outputText">
                    Decrypted Output
                </label>

                <textarea id="outputText" readonly placeholder="Decrypted result will appear here..."></textarea>


                <button class="copy" onclick="copyOutput()">
                    Copy Output
                </button>

            </div>


            <div id="status"></div>

        </div>
    </div>

</body>

</html>
